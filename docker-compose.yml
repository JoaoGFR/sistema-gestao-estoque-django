services:
  # Serviço do Banco de Dados
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jgtech_user -d jgtech_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Serviço do Site (Django)
  web:
    # Usa a imagem publicada no Docker Hub — não faz build no servidor
    image: joaogfro/sistema-estoque:1.6.1
    restart: always
    # Roda migrate automaticamente antes de iniciar o servidor.
    # Isso garante que as tabelas do django-axes (e qualquer migration futura)
    # existam no banco antes de qualquer requisição chegar.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn setup.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

volumes:
  postgres_data: