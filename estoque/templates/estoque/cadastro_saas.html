{% extends 'estoque/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5">
        
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary"><i class="bi bi-rocket-takeoff"></i> Criar Conta</h2>
            <p class="text-muted">Preencha os dados abaixo para começar a usar o JGTECH.</p>
        </div>

        <div class="card shadow-lg border-0">
            <div class="card-body p-5">
                
                <form method="post">
                    {% csrf_token %}
                    
                    {{ form|crispy }}
                    
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success btn-lg fw-bold">
                            Acessar Sistema Agora <i class="bi bi-arrow-right"></i>
                        </button>
                    </div>
                </form>

            </div>
            <div class="card-footer text-center py-3 bg-light">
                <small class="text-muted">
                    Já tem uma conta? <a href="{% url 'login' %}" class="text-decoration-none">Fazer Login</a>
                </small>
            </div>
        </div>

        <div class="text-center mt-3">
            <small class="text-muted">
                <i class="bi bi-shield-lock"></i> Seus dados estão seguros.
            </small>
        </div>

    </div>
</div>
{% endblock %}
